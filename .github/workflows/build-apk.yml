
name: Build X7c Pro Camera APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'X7c_Pro_Camera_Enhanced.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o X7c_Pro_Camera_Enhanced.zip -d extracted

      - name: Fix Android build settings
        working-directory: extracted/X7c_Pro_Camera
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()
          if "jvmTarget = \"17\"" not in s:
              s = s.replace(
                  "android {\n",
                  'android {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = "17"\n    }\n',
                  1
              )
          p.write_text(s)

          p = Path("app/src/main/java/com/x7cpro/camera/MainActivity.kt")
          s = p.read_text()
          s = s.replace(
              "import androidx.camera.video.QualitySelector",
              "import androidx.camera.video.FallbackStrategy\nimport androidx.camera.video.QualitySelector"
          )
          s = s.replace(
              "QualitySelector.FALLBACK_STRATEGY_LOWER_QUALITY",
              "FallbackStrategy.lowerQualityOrHigherThan(Quality.SD)"
          )
          p.write_text(s)
          PY

      - name: Build APK
        working-directory: extracted/X7c_Pro_Camera
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: X7c-Pro-Camera-debug-apk
          path: extracted/X7c_Pro_Camera/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
