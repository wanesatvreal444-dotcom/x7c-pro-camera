name: Build X7c Pro Camera APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'X7c_Pro_Camera_Enhanced.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project from ZIP
        run: |
          unzip -o X7c_Pro_Camera_Enhanced.zip -d extracted
          test -f extracted/X7c_Pro_Camera/app/build.gradle.kts
          test -f extracted/X7c_Pro_Camera/app/src/main/java/com/x7cpro/camera/MainActivity.kt

      - name: Build debug APK
        working-directory: extracted/X7c_Pro_Camera
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: X7c-Pro-Camera-debug-apk
          path: extracted/X7c_Pro_Camera/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
